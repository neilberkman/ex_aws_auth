name: Elixir CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Elixir ${{matrix.elixir}} | OTP ${{matrix.otp}})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Earliest supported version
          - elixir: "1.15.8"
            otp: "26.2.5.21"
          # Latest 1.16 series
          - elixir: "1.16.3"
            otp: "26.2.5.21"
          # Latest 1.17 series
          - elixir: "1.17.3"
            otp: "27.3.4.17"
          # Latest 1.18 series with OTP 28
          - elixir: "1.18.5"
            otp: "28.5.0.6"
          # Latest 1.19 series with OTP 28
          - elixir: "1.19.6"
            otp: "28.5.0.6"
          # Latest 1.20 series with OTP 29 (primary target: runs format/credo/dialyzer)
          - elixir: "1.20.4"
            otp: "29.0.6"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}-${{ hashFiles('**/mix.exs') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}-
            ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile with warnings as errors
        run: MIX_ENV=test mix compile --warnings-as-errors

      - name: Check formatting
        if: ${{ matrix.elixir == '1.20.4' && matrix.otp == '29.0.6' }}
        run: mix format --check-formatted

      - name: Run tests
        run: mix test --trace

      - name: Run Credo
        if: ${{ matrix.elixir == '1.20.4' && matrix.otp == '29.0.6' }}
        run: mix credo --strict

      - name: Run Dialyzer
        if: ${{ matrix.elixir == '1.20.4' && matrix.otp == '29.0.6' }}
        run: mix dialyzer --format github
